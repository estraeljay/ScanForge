name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle -p core test :cli:installDist
      - name: Printable marker boards
        run: for s in a4 a3 a2; do core/cli/build/install/scanforge-cli/bin/scanforge-cli board "boards/scanforge-board-$s.pdf" --size $s; done
      - uses: actions/upload-artifact@v4
        with: { name: core-cli, path: core/cli/build/install/scanforge-cli }
      - uses: actions/upload-artifact@v4
        with: { name: marker-boards, path: boards/*.pdf }

  blender:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install bpy==5.2.2
      - run: gradle -p core :cli:installDist
      - run: scripts/test_blender.sh python
      - run: scripts/build_blender_extension.sh
      - uses: actions/upload-artifact@v4
        with: { name: blender-extension, path: dist/*.zip }

  android-framework-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle -p tools/android-framework-check compileKotlin

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
